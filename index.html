<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="format-detection" content="telephone=no"/>
<title>GTWMG25 Mock Book — DEMO</title>
<style>
:root {
  --bg:#0e0f14; --bg2:#171a22; --bg3:#1e2330; --card:#1a1d27;
  --border:#2a3040; --text:#e8eaf0; --muted:#8b93a7; --dim:#5c657a;
  --yes:#3dffa8; --yes-dim:#1a3d30; --no:#ff6b8a; --no-dim:#3d1a24;
  --accent:#7c9cff; --warn:#ffcc66; --rake:#c4a5ff;
  --good:#3dffa8; --bad:#ff6b8a;
  --radius:12px;
  --phone:390px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#05060a;color:var(--text);
  font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  font-size:14px;line-height:1.35;
  height:100%;
  -webkit-text-size-adjust:100%;
  overscroll-behavior:none}
html{height:100%;height:100dvh}
body{display:flex;justify-content:center;min-height:100%;min-height:100dvh;
  overflow:hidden}
.app{width:100%;max-width:var(--phone);height:100%;height:100dvh;min-height:100%;min-height:100dvh;
  background:var(--bg);border-left:1px solid #111;border-right:1px solid #111;
  display:flex;flex-direction:column;position:relative;overflow:hidden}
@media (max-width:430px){
  body{background:var(--bg)}
  .app{max-width:none;width:100%;border-left:none;border-right:none}
}
.banner{background:linear-gradient(90deg,#5b1a1a,#3d2a00);color:#ffcc66;
  text-align:center;font-size:11px;font-weight:700;letter-spacing:.06em;
  padding:7px 10px;padding-top:max(7px, env(safe-area-inset-top));
  border-bottom:1px solid #664400;position:sticky;top:0;z-index:50;flex-shrink:0}
.header{padding:14px 16px 8px;background:var(--bg);border-bottom:1px solid var(--border)}
.header h1{margin:0;font-size:18px;font-weight:750;letter-spacing:-.02em}
.header .sub{color:var(--muted);font-size:12px;margin-top:3px}
.pills{display:flex;gap:6px;padding:10px 12px 0;overflow-x:auto;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;padding:7px 12px;border-radius:999px;background:var(--bg2);
  border:1px solid var(--border);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer}
.pill.on{background:var(--accent);color:#0b1020;border-color:var(--accent)}
.flight-row{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;scrollbar-width:none}
.flight-row::-webkit-scrollbar{display:none}
.ftab{flex:0 0 auto;padding:8px 11px;border-radius:8px;background:var(--bg2);
  border:1px solid var(--border);color:var(--muted);font-size:11px;font-weight:700;
  letter-spacing:.04em;cursor:pointer}
.ftab.on{background:#243056;color:#c5d4ff;border-color:#3d5a9e}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;padding:8px 12px 90px;min-height:0}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px;margin-bottom:10px}
.card.winner{border-color:#2a6b4a;box-shadow:inset 0 0 0 1px #1a3d30}
.team-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.team-name{font-weight:700;font-size:13.5px}
.team-meta{color:var(--muted);font-size:11px;margin-top:2px}
.price-block{text-align:right}
.price-pct{font-size:22px;font-weight:800;color:var(--yes);font-variant-numeric:tabular-nums}
.price-amer{font-size:11px;color:var(--muted);margin-top:1px}
.price-chg{font-size:10px;margin-top:2px}
.price-chg.up{color:var(--yes)} .price-chg.dn{color:var(--no)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btn{border:none;border-radius:8px;padding:10px 8px;font-weight:700;font-size:12px;cursor:pointer}
.btn-yes{background:var(--yes-dim);color:var(--yes);border:1px solid #2a6b4a}
.btn-no{background:var(--no-dim);color:var(--no);border:1px solid #6b2a3a}
.btn:active{transform:scale(.98);opacity:.85}
.btn small{display:block;font-weight:500;opacity:.75;margin-top:2px;font-size:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(78px + env(safe-area-inset-bottom, 0px));background:#243056;
  color:#c5d4ff;padding:8px 14px;border-radius:8px;font-size:12px;z-index:100;
  border:1px solid #3d5a9e;opacity:0;pointer-events:none;transition:opacity .2s;
  max-width:min(340px, calc(100vw - 24px));width:max-content;text-align:center}
.toast.show{opacity:1}
.nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(14,15,20,.96);border-top:1px solid var(--border);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:40;flex-shrink:0;
  padding-bottom:env(safe-area-inset-bottom, 0px)}
.nav button{background:none;border:none;color:var(--dim);padding:10px 4px 12px;font-size:10px;
  font-weight:700;letter-spacing:.04em;cursor:pointer;
  min-height:44px;-webkit-user-select:none;user-select:none}
.nav button.on{color:var(--accent)}
.nav button span{display:block;font-size:16px;margin-bottom:2px}
.section-title{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--dim);
  text-transform:uppercase;margin:12px 2px 8px}
.prop-cat{display:inline-block;font-size:10px;padding:2px 7px;border-radius:999px;
  background:var(--bg3);color:var(--rake);border:1px solid #3a2a55;margin-bottom:6px}
.feed-item{display:grid;grid-template-columns:52px 1fr auto;gap:8px;padding:10px 0;
  border-bottom:1px solid var(--border);align-items:start}
.feed-item:last-child{border-bottom:none}
.feed-hole{font-size:11px;font-weight:700;color:var(--accent);padding-top:2px}
.feed-body{font-size:12.5px}
.feed-body .who{font-weight:700}
.feed-body .mkt{color:var(--muted);font-size:11px;margin-top:2px}
.feed-side{text-align:right;font-size:12px;font-weight:700}
.feed-side.yes{color:var(--yes)} .feed-side.no{color:var(--no)}
.feed-note{font-size:10px;color:var(--dim);margin-top:3px;font-style:italic}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px}
.stat .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat .val{font-size:20px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.winner-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.winner-row:last-child{border-bottom:none}
.pnl-pos{color:var(--good)} .pnl-neg{color:var(--bad)}
.home-hero{background:linear-gradient(160deg,#1a2040,#0e0f14 70%);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;margin-bottom:12px}
.home-hero h2{margin:0 0 6px;font-size:16px}
.home-hero p{margin:0;color:var(--muted);font-size:12px}
.flight-list-item{display:flex;justify-content:space-between;align-items:center;
  padding:12px;background:var(--card);border:1px solid var(--border);border-radius:10px;
  margin-bottom:8px;cursor:pointer}
.flight-list-item:active{background:var(--bg3)}
.flight-list-item .fl{font-weight:800;letter-spacing:.06em;font-size:13px}
.flight-list-item .fav{color:var(--muted);font-size:11px;margin-top:3px}
.chip{font-size:10px;padding:3px 7px;border-radius:6px;background:var(--bg3);color:var(--muted)}
.mode-bar{display:flex;gap:6px;padding:0 0 8px}
.mode-bar button{flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);
  background:var(--bg2);color:var(--muted);font-size:11px;font-weight:700;cursor:pointer}
.mode-bar button.on{background:#243056;color:#c5d4ff;border-color:#3d5a9e}
.basis{font-size:10px;color:var(--dim);margin-top:8px;line-height:1.4}
.settle-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;margin-left:6px}
.settle-badge.y{background:var(--yes-dim);color:var(--yes)}
.settle-badge.n{background:var(--no-dim);color:var(--no)}
.hidden{display:none !important}
.footer-note{font-size:10px;color:var(--dim);padding:8px 4px 20px;text-align:center;line-height:1.45}

.acct{position:sticky;top:0;z-index:35;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px 10px;background:rgba(14,15,20,.97);border-bottom:1px solid var(--border)}
.acct button{background:#1a1c24;border:1px solid var(--border);border-radius:8px;padding:5px 4px;color:#fff;cursor:pointer;text-align:center}
.acct .l{font-size:9px;letter-spacing:.06em;color:var(--dim);font-weight:700}
.acct .v{font-size:14px;font-weight:800}
.acct .pend .v{color:#ffcc66}
.subnav{display:flex;gap:4px;margin:2px 0 8px}
.subnav button{flex:1;background:#1a1c24;border:1px solid var(--border);color:var(--dim);font-size:11px;font-weight:700;padding:8px 2px;border-radius:8px;cursor:pointer}
.subnav button.on{color:var(--accent);border-color:var(--accent)}
.crumb{font-size:11px;color:var(--dim);margin-bottom:6px}.crumb a{color:var(--accent);cursor:pointer}
table.tk{width:100%;border-collapse:collapse;font-size:12px}
.tk th{font-size:10px;color:var(--dim);text-align:left;padding:5px 4px;border-bottom:1px solid var(--border)}
.tk td{padding:6px 4px;vertical-align:top}.tk td.n,.tk th.n{text-align:right;white-space:nowrap}
.tk tr.r:nth-of-type(4n+1){background:rgba(255,255,255,.035)}
.tk tr.r{cursor:pointer}.tk tr.x td{background:#12141b;font-size:11px;color:var(--muted);line-height:1.5}
.tk tfoot td{font-weight:800;border-top:1px solid var(--border);padding:7px 4px}
.sy{color:#4ade80;font-weight:700}.sn{color:#f87171;font-weight:700}
.st{font-size:9px;font-weight:800;padding:1px 5px;border-radius:4px}.st.P{background:#3d2a00;color:#ffcc66}.st.W{background:#123a22;color:#4ade80}.st.L{background:#3a1515;color:#f87171}
</style>
</head>
<body>
<div class="app" id="app">

    <div class="sub" id="hdr-sub">2025 Green Tree · flight winners + props</div>

  <div id="view-home" class="main"></div>
  <div id="view-flight" class="main hidden"></div>
  <div id="view-props" class="main hidden"></div>
  <div id="view-feed" class="main hidden"></div>
  <div id="view-settle" class="main hidden"></div>
  <div id="view-tickets" class="main hidden"></div>

  <div class="toast" id="toast"></div>

    <button data-view="settle"><span>$</span>SETTLE</button>
  </nav>
</div>

}

  if(priceMode==='open') return t.amer0;
  if(priceMode==='final') return amer(teamPrice(t));
  return t.amer_live;
}
function propPrice(p){
  if(priceMode==='open') return p.yes0;
  if(priceMode==='final') return p.yes_final;
  return p.yes_live;
}
function amer(p){
  p = Math.max(0.01, Math.min(0.99, p));
  if(p>=0.5) return String(Math.round(-100*p/(1-p)));
  return '+' + Math.round(100*(1-p)/p);
}
function chg(t){
  const d = teamPrice(t) - t.yes0;
  if(Math.abs(d)<0.005) return {cls:'', txt:'vs open —'};
  return {cls: d>0?'up':'dn', txt:(d>0?'▲ ':'▼ ')+(Math.abs(d)*100).toFixed(1)+'¢ vs open'};
}

function setView(v){

  // feed is accessed from home; map feed button? we have 4 nav - feed via home link
  if(v==='home') renderHome();
  if(v==='flight') renderFlight();
  if(v==='props') renderProps();
  if(v==='feed') renderFeed();
  if(v==='settle') renderSettle();
  if(v==='tickets') renderTickets();
  renderAcct();
  window.scrollTo(0,0);
}

// ===== LuckySP-style Tickets: Balance|Pending|Available, Figures|Pending|Transactions =====
let tkTab='pending', tkOpen=null, figDrill=null;
const BANKROLL=5000;
const HOLES=[0,3,6,9,12,15,18];
function hl(h){return h===0?'OPEN':'H'+h;}
function liveHole(){return priceMode==='open'?0:priceMode==='live'?12:18;}
function placed(){return DATA.trades.filter(t=>t.hole<=liveHole());}
function yesWins(t){ if(t.kind==='flight') return DATA.winners[t.flight]===t.market;
  const p=DATA.props.find(p=>p.title===t.market||p.id===t.market); return p?!!p.settle_yes:false; }
function status(t){ if(priceMode!=='final') return 'P'; return ((t.side==='Yes')===yesWins(t))?'W':'L'; }
function toWin(t){ return t.shares; } // payout if side wins ($1/share)
function tkPnl(t){ const s=status(t); return s==='W'?t.shares-t.stake:s==='L'?-t.stake:0; }
function acctNums(){ const tr=placed(); const rake=tr.reduce((a,t)=>a+t.rake,0);
  const pend=tr.filter(t=>status(t)==='P').reduce((a,t)=>a+t.stake,0);
  const bal=BANKROLL+rake; return {bal,pend,avail:bal-pend}; }
function renderAcct(){ const n=acctNums();
  $('#acct').innerHTML=`<button onclick="tkTab='figures';setView('tickets')"><div class="l">BALANCE</div><div class="v">${money(n.bal)}</div></button>
  <button class="pend" onclick="tkTab='pending';tkOpen=null;setView('tickets')"><div class="l">PENDING</div><div class="v">${money(n.pend)}</div></button>
  <button onclick="tkTab='transactions';setView('tickets')"><div class="l">AVAILABLE</div><div class="v">${money(n.avail)}</div></button>`; }
function desc(t){ return `${t.kind==='flight'?'✈':'✦'} <b>${t.flight}</b> · ${t.market} · <span class="${t.side==='Yes'?'sy':'sn'}">${t.side} ${amer(t.price)}</span>`; }
function tkRows(list){ return list.map(t=>{ const s=status(t);
  const row=`<tr class="r" onclick="tkOpen=(tkOpen===${t.id}?null:${t.id});renderTickets()"><td>${hl(t.hole)}<br><span class="st ${s}">${s==='P'?'PENDING':s==='W'?'WON':'LOST'}</span></td><td>${desc(t)}</td><td class="n">${money(t.stake)}</td><td class="n">${money(toWin(t))}</td></tr>`;
  const x= tkOpen===t.id?`<tr class="x"><td colspan="4">Ticket #${t.id} · ${t.bettor} · ${s==='P'?'Pending':s==='W'?'Won':'Lost'}<br>Risk ${money(t.stake)} / To Win ${money(toWin(t))} (${t.shares.toFixed(1)} sh @ ${pct(t.price)})${s!=='P'?` · P&L <span class="${pnlClass(tkPnl(t))}">${money(tkPnl(t))}</span>`:''}<br>Market: ${t.kind==='flight'?'Flight winner — '+t.flight:'Prop'} · Selection: ${t.market} ${t.side}<br>Accepted: ${t.t} (${hl(t.hole)}) · Rake ${money(t.rake)}${t.note?'<br>Note: '+t.note:''}</td></tr>`:'<tr></tr>';
  return row+x; }).join(''); }
function tkTable(list){ const R=list.reduce((a,t)=>a+t.stake,0), W=list.reduce((a,t)=>a+toWin(t),0);
  return `<div class="card" style="padding:4px"><table class="tk"><thead><tr><th>Accepted</th><th>Description</th><th class="n">Risk</th><th class="n">To Win</th></tr></thead><tbody>${tkRows(list)||'<tr><td colspan=4>No tickets</td></tr>'}</tbody>
  <tfoot><tr><td colspan="2">Total (${list.length})</td><td class="n">${money(R)}</td><td class="n">${money(W)}</td></tr></tfoot></table></div>`; }
function renderTickets(){
  $('#hdr-title').textContent='Tickets';
  $('#hdr-sub').textContent=priceMode==='final'?'Settled · Won / Lost':priceMode==='live'?'Live thru hole 12 · open risk':'Opening market';
  const mb=`<div class="pills">${['open','live','final'].map(m=>`<button class="pill ${priceMode===m?'on':''}" onclick="priceMode='${m}';setView('tickets')">${m==='live'?'LIVE (H12)':m.toUpperCase()}</button>`).join('')}</div>`;
  const sn=`<div class="subnav">${[['figures','Figures'],['pending','Pending'],['transactions','Transactions']].map(([k,l])=>`<button class="${tkTab===k?'on':''}" onclick="tkTab='${k}';figDrill=null;tkOpen=null;renderTickets()">${l}</button>`).join('')}</div>`;
  const tr=placed(); let body='';
  if(tkTab==='pending'){
    const pend=tr.filter(t=>status(t)==='P').reverse();
    body=`<div class="crumb">Tickets › Pending Wagers</div>`+(pend.length?tkTable(pend):`<div class="card team-meta">No open risk — all tickets settled. See Figures or Transactions for Won/Lost.</div>`);
  } else if(tkTab==='transactions'){
    body=`<div class="crumb">Tickets › Transactions</div>`+tkTable([...tr].reverse());
  } else if(figDrill!==null){
    body=`<div class="crumb"><a onclick="figDrill=null;renderTickets()">Tickets › Figures</a> › ${hl(figDrill)}</div>`+tkTable(tr.filter(t=>t.hole===figDrill));
  } else {
    const rows=HOLES.filter(h=>h<=liveHole()).map(h=>{const l=tr.filter(t=>t.hole===h);
      const st=l.reduce((a,t)=>a+t.stake,0), rk=l.reduce((a,t)=>a+t.rake,0), pl=l.reduce((a,t)=>a+tkPnl(t),0);
      return `<tr class="r" onclick="figDrill=${h};renderTickets()"><td>${hl(h)}</td><td class="n">${l.length}</td><td class="n">${money(st)}</td><td class="n" style="color:var(--rake)">${money(rk)}</td><td class="n ${pnlClass(pl)}">${priceMode==='final'?money(pl):'—'}</td></tr><tr></tr>`;}).join('');
    const T=(f)=>tr.reduce((a,t)=>a+f(t),0);
    body=`<div class="crumb">Tickets › Figures (tap a window to drill in)</div><div class="card" style="padding:4px"><table class="tk"><thead><tr><th>Window</th><th class="n">Tix</th><th class="n">Handle</th><th class="n">Rake</th><th class="n">Bettor P&L</th></tr></thead><tbody>${rows}</tbody>
    <tfoot><tr><td>Total</td><td class="n">${tr.length}</td><td class="n">${money(T(t=>t.stake))}</td><td class="n" style="color:var(--rake)">${money(T(t=>t.rake))}</td><td class="n">${priceMode==='final'?money(T(tkPnl)):'—'}</td></tr></tfoot></table></div>
    <button class="btn btn-no" style="width:100%;margin-top:8px" onclick="setView('settle')">Full settlement & leaderboard</button>`;
  }
  $('#view-tickets').innerHTML=mb+sn+body+`<div class="footer-note">MOCK book wallet: $${BANKROLL} bankroll + rake · To Win = payout if side hits ($1/share, after 8% rake) · not real money</div>`;
}

// Hash routes for deep links / screenshots: #home #flight #flight-SANTA #props #feed #settle
function routeFromHash(){
  const h = (location.hash||'#home').slice(1);
  if(h==='settle'){ setView('settle'); return; }
  if(h==='props'){ setView('props'); return; }
  if(h==='feed'){ setView('feed'); return; }
  if(h.startsWith('tickets')){ const p=h.split('-'); tkTab=p[1]||'pending'; if(p[2]) priceMode=p[2]; setView('tickets'); return; }
  if(h==='home' || h===''){ setView('home'); return; }
  if(h.startsWith('flight')){
    const parts = h.split('-');
    if(parts[1] && DATA.flights.includes(parts[1])) flight = parts[1];
    priceMode = 'live';
    setView('flight');
    return;
  }
  setView('home');
}
window.addEventListener('hashchange', routeFromHash);
routeFromHash();
